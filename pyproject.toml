[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohayo-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2",
    "requests>=2.31",
    "line-bot-sdk>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ohayo_bot"]
